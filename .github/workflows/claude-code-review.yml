name: Claude Code Review

on:
  pull_request:
    types: [edited]

jobs:
  claude-review:
    if: contains(github.event.pull_request.body, '- [x] Claude にレビューを依頼')
    name: claude review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          allowed_bots: "renovate"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            このプルリクエストをレビューしてください。

            リポジトリ: ${{ github.repository }}
            PR番号: ${{ github.event.pull_request.number }}

            ## レビュー方針

            - コメントはすべて日本語で書く
            - 重大な問題（バグ・セキュリティ・パフォーマンス）を優先し、軽微なスタイル指摘は最小限にとどめる
            - 命名・技術規約（Next.js / Supabase / TypeScript / Tailwind）はリポジトリ直下の `CLAUDE.md` に従う
            - 以下は指摘しない:
              - フォーマット（インデント・クォート・import 順序）… Biome が自動管理する
              - ループインデックス `i` / `j` / `k`、慣習的な省略形（`req`, `res`, `ctx`, `err`）、スコープが1〜2行の一時変数

            ## 重点的に見る観点

            - 型安全性: `any` の多用、型アサーション（`as`）の乱用
            - セキュリティ: 環境変数の露出、XSS / SQL インジェクションのリスク
            - 可読性: 長すぎる関数・深すぎるネストは分割を提案する
            - 重複コード: 同じロジックが複数箇所にあれば共通化を提案する

            ## 出力フォーマット

            1. 問題のある箇所には `mcp__github_inline_comment__create_inline_comment` でインラインコメントを付ける。
            2. 総括として、以下の構成のコメントを1件投稿する。再レビュー依頼時は新規投稿せず既存の総括コメントを
               更新する（`gh pr comment "$PR" --edit-last --create-if-none` を使う。詳細は後述）:

               ## 🤖 Claude レビュー

               ### 影響範囲
               この変更が影響する機能・画面・API・データなどを、差分から判断できる範囲で箇条書きにする。
               差分だけでは影響を追いきれない場合は憶測で断定せず「差分からは判断不可」と明記する。

               ### 変更箇所
               主要な変更ファイルごとに、何をどう変えたかを箇条書きで要約する。

               ### 確認したいこと（PR作成者へ）
               意図・背景・影響が差分から読み取れず、確認が必要な点を列挙する。
               （例: 変更の目的が不明 / 呼び出し元への影響が追えない / マイグレーションの有無が不明 など）
               不足が無ければ「特になし」と書く。

               ### レビュー所感
               全体的な所感、インラインで指摘しきれない点、PR本文（動作確認・スクリーンショット・注意事項など）の
               不足を補足する。指摘が無ければその旨を書く。

            「影響範囲」「変更箇所」は必須セクション。ただし差分から確実に言えることだけを書き、
            推測が必要な箇所は断定せず「判断不可」として「確認したいこと」に回すこと。誤った決めつけはしない。

            総括コメントは `--edit-last --create-if-none` を付け、既存の総括コメントがあれば更新、無ければ新規作成する。
            これにより再レビュー依頼のたびにコメントが増えず、常に最新の1件だけが残る。
            投稿時は本文に \n という文字列を含めず、必ずヒアドキュメントで実際の改行を使うこと。例:

              gh pr comment "$PR" --edit-last --create-if-none --body "$(cat <<'EOF'
              実際の改行を含む本文
              EOF
              )"
          claude_args: |
            --model claude-sonnet-4-6
            --allowed-tools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
