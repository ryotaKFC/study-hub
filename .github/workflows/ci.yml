name: CI

on:
  pull_request:
    branches: [develop]

jobs:
  biome:
    name: biome check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: biome check
        run: pnpm run check
